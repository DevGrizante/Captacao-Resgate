# ==============================================================================
#  Deploy — publica as imagens no registry e recarrega o servidor.
#
#  ESCRITO PARA ORACLE CLOUD (OCIR), MAS NÃO PRESO A ELE
#
#  O registry é endereçado por variáveis, não por nome fixo. Trocar para
#  Amazon ECR ou Azure ACR é trocar os segredos e a URL — o restante do
#  arquivo continua valendo, porque o que ele faz é build, push e um
#  `docker compose pull && up -d` do outro lado.
#
#  O QUE PRECISA ESTAR CONFIGURADO (Settings > Secrets and variables)
#
#    Secrets                                   Variables
#    ─────────────────────────────────         ──────────────────────────
#    OCIR_USUARIO   <tenancy>/<usuário>        OCIR_REGIAO      gru.ocir.io
#    OCIR_TOKEN     auth token do OCI          OCIR_NAMESPACE   <namespace>
#    SSH_CHAVE      chave privada do deploy    SERVIDOR_HOST    ip ou domínio
#                                              SERVIDOR_USUARIO ubuntu
#                                              SERVIDOR_CAMINHO /home/ubuntu/painel
#
#  POR QUE O DEPLOY É POR TAG, E NÃO POR PUSH NA MAIN
#
#  Um merge na main precisa poder acontecer sem ir para produção. Amarrar o
#  deploy à tag `v*` torna a publicação um ato deliberado, com um nome que
#  aparece no histórico — e dá um alvo óbvio para rollback: a tag anterior.
#
#  `workflow_dispatch` continua existindo para o dia em que for preciso
#  publicar sem cortar uma versão.
# ==============================================================================
name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da imagem a publicar (padrão: o SHA do commit)"
        required: false

# Nunca dois deploys ao mesmo tempo. `cancel-in-progress: false` de propósito:
# cancelar um deploy no meio deixa o servidor num estado que ninguém sabe
# descrever. O segundo espera o primeiro terminar.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  publicar:
    name: Build e push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.versao.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir a tag da imagem
        id: versao
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Entrar no OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.OCIR_REGIAO }}
          username: ${{ vars.OCIR_NAMESPACE }}/${{ secrets.OCIR_USUARIO }}
          password: ${{ secrets.OCIR_TOKEN }}

      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          # `latest` ao lado da versão: o compose do servidor aponta para uma
          # tag estável, e a versão fica no histórico do registry para rollback.
          tags: |
            ${{ vars.OCIR_REGIAO }}/${{ vars.OCIR_NAMESPACE }}/captacao-resgate-api:${{ steps.versao.outputs.tag }}
            ${{ vars.OCIR_REGIAO }}/${{ vars.OCIR_NAMESPACE }}/captacao-resgate-api:latest
          # A e2.micro do free tier é ARM (Ampere). Construir só para amd64
          # produziria uma imagem que o servidor não consegue rodar — e o erro
          # só apareceria no `docker compose up`, do outro lado do deploy.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Painel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.OCIR_REGIAO }}/${{ vars.OCIR_NAMESPACE }}/captacao-resgate-web:${{ steps.versao.outputs.tag }}
            ${{ vars.OCIR_REGIAO }}/${{ vars.OCIR_NAMESPACE }}/captacao-resgate-web:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  soltar:
    name: Recarregar o servidor
    runs-on: ubuntu-latest
    needs: publicar
    # `environment` liga a proteção de ambiente do GitHub: com "required
    # reviewers" configurado, o deploy passa a exigir aprovação humana. É onde
    # se coloca o freio, se um dia ele for necessário.
    environment: producao
    steps:
      - name: docker compose pull && up -d
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVIDOR_HOST }}
          username: ${{ vars.SERVIDOR_USUARIO }}
          key: ${{ secrets.SSH_CHAVE }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ vars.SERVIDOR_CAMINHO }}

            echo "$OCIR_TOKEN" | docker login ${{ vars.OCIR_REGIAO }} \
              -u '${{ vars.OCIR_NAMESPACE }}/${{ secrets.OCIR_USUARIO }}' --password-stdin

            export TAG='${{ needs.publicar.outputs.tag }}'
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # `image prune` só do que ficou órfão: as imagens antigas COM TAG
            # continuam no disco, que é o que torna o rollback um `TAG=v1.2
            # docker compose up -d` em vez de um novo build.
            docker image prune -f

          envs: OCIR_TOKEN
        env:
          OCIR_TOKEN: ${{ secrets.OCIR_TOKEN }}

      - name: O painel voltou?
        # Sem esta conferência, um deploy que sobe container quebrado termina
        # verde e ninguém fica sabendo até alguém abrir a tela.
        run: |
          for tentativa in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://${{ vars.SERVIDOR_HOST }}/health"; then
              echo
              echo "Painel no ar (tentativa $tentativa)."
              exit 0
            fi
            sleep 5
          done
          echo "O /health não respondeu em 150s após o deploy."
          exit 1
