# =============================================================================
#  nginx - Captacao e Resgate (frontend estatico + proxy da API)
#  Servir o front e a API sob a MESMA origem resolve tres coisas de uma vez:
#  nao ha preflight de CORS, o config.js nao precisa saber o host da API, e o
#  navegador reaproveita a mesma conexao TCP para pagina e dados.
# =============================================================================

# Upstream nomeado: "api" e o nome do servico no docker-compose.yml.
# O DNS interno do Docker resolve; keepalive evita reabrir conexao a cada
# requisicao do painel (que dispara varias chamadas em paralelo).
upstream captacao_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nao anuncia a versao do nginx nos headers de erro.
    server_tokens off;

    # --- Compressao -----------------------------------------------------
    # gzip_static: usa os .gz gerados no build (custo zero de CPU).
    gzip_static on;
    # gzip on: para o que nao foi pre-comprimido, como as respostas JSON
    # vindas da API pelo proxy.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # --- Cabecalhos de seguranca ----------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API ------------------------------------------------------------
    # Tudo sob /api vai para o container da API. Sem isso o front precisaria
    # de API_BASE apontando para fora e de CORS liberado.
    location ^~ /api/ {
        proxy_pass         http://captacao_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A primeira requisicao apos subir dispara a carga das bases da CVM,
        # que pode passar de 2 minutos. O default de 60s cortaria a resposta
        # no meio e o painel mostraria erro de rede sem motivo real.
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Resposta de dados nao pode ser cacheada pelo navegador: o painel
        # reflete o arquivo do dia.
        proxy_buffering off;
    }

    # /health e /docs seguem o mesmo caminho -- uteis para diagnostico.
    location ~ ^/(health|docs|redoc|openapi\.json) {
        proxy_pass         http://captacao_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
    }

    # --- Assets estaticos -----------------------------------------------
    # Os .html referenciam os scripts com ?v=NN (cache busting manual do
    # projeto), entao o JS/CSS pode ter cache longo com seguranca.
    location ~* \.(js|css|svg|woff2?|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # ATENCAO (pegadinha classica do nginx): `add_header` NAO e herdado
        # quando o bloco atual declara o proprio `add_header` -- ele SUBSTITUI
        # todos os do nivel de cima. Sem repetir aqui, o HTML sairia sem os
        # headers de seguranca definidos no server. Verificado com `curl -I`.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # O HTML nunca fica em cache: e ele que carrega a versao nova dos assets.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        # ATENCAO (pegadinha classica do nginx): `add_header` NAO e herdado
        # quando o bloco atual declara o proprio `add_header` -- ele SUBSTITUI
        # todos os do nivel de cima. Sem repetir aqui, o HTML sairia sem os
        # headers de seguranca definidos no server. Verificado com `curl -I`.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # O projeto e multipagina (index / fundos / tesourarias / admin), nao SPA:
    # 404 de verdade para caminho inexistente, sem fallback para index.html.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
